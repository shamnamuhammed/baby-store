name: LilBunny CI

on:
  push:
    branches:
      - feature/reviews
      - main
    paths:
      - "Backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - feature/reviews
      - main
    paths:
      - "Backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend install and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

  backend-check:
    name: Backend dependencies and Django checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1

      DB_NAME: lilbunny_ci
      DB_USER: lilbunny_ci
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com

      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder

      REDIS_URL: redis://127.0.0.1:6379/0

      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_HOST_PASSWORD: ci-only-password
      DEFAULT_FROM_EMAIL: ci@example.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check
